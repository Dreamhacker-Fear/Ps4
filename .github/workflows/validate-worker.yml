name: Validate Worker

on:
  push:
    branches:
      - main
      - feature/owner-system
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  worker:
    name: Worker syntax and Wrangler dry run
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Worker JavaScript syntax
        run: node --check orbis-auth-worker.js

      - name: Validate Wrangler configuration and bundle
        run: npx --yes wrangler@4 deploy --dry-run
