name: Validate Worker

on:
  push:
    branches:
      - main
      - feature/owner-system
      - feature/ps4-ui-reference-owner-system
  pull_request:
    branches:
      - main
      - feature/owner-system

permissions:
  contents: read

jobs:
  worker:
    name: Worker syntax and Wrangler dry run
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Worker JavaScript syntax
        run: node --check orbis-auth-worker.js
      - name: Check dashboard source parity and visual adaptation markers
        run: |
          node -e "const fs=require('fs'); const a=fs.readFileSync('ps4.lua','utf8'); const b=fs.readFileSync('source/ps4.lua','utf8'); if(a!==b) throw new Error('ps4.lua and source/ps4.lua differ'); for(const marker of ['PS4 UI reference adaptation','SystemRail','WallpaperBloom']) if(!a.includes(marker)) throw new Error('Missing UI marker: '+marker); console.log('Dashboard source copies match and visual adaptation markers are present.');"

      - name: Validate Wrangler configuration and bundle
        run: npx --yes wrangler@4 deploy --dry-run
